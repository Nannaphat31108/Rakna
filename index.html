<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รักนะ</title>
<meta property="og:title" content="รักนะ">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8fa;
    --blush: #ffe6ee;
    --pink: #f5b3c4;
    --pink-deep: #e2809b;
    --rose: #c75b7a;
    --ink: #5e3a46;
    --ink-soft: #9b7581;
    --white: #ffffff;
    --shadow: 0 24px 48px -24px rgba(199, 91, 122, .5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif; font-weight: 300;
    color: var(--ink); background: var(--bg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }

  /* soft moving background blobs */
  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blobs span {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .7;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .blobs span:nth-child(1) { width: 60vmax; height: 60vmax; background: #ffd9e4; top: -20vmax; left: -15vmax; }
  .blobs span:nth-child(2) { width: 50vmax; height: 50vmax; background: #ffeef3; bottom: -20vmax; right: -10vmax; animation-delay: -6s; }
  .blobs span:nth-child(3) { width: 30vmax; height: 30vmax; background: #fcd1dd; top: 40%; left: 55%; animation-delay: -12s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

  /* screens */
  .screen {
    position: fixed; inset: 0; z-index: 2;
    display: grid; place-items: center;
    padding: 72px 16px 40px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    opacity: 0; visibility: hidden; transform: translateY(24px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1), visibility 0s .7s;
  }
  .screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .inner { width: 100%; max-width: 980px; display: grid; gap: 40px; align-items: center; }
  @media (min-width: 820px) { .inner.split { grid-template-columns: 1fr 1fr; gap: 64px; } }

  .label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: .14em; color: var(--rose);
    text-transform: uppercase;
  }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--pink-deep); }
  h1, h2 { font-weight: 500; color: var(--ink); line-height: 1.35; text-wrap: balance; }
  h1 { font-size: clamp(34px, 7vw, 60px); }
  h2 { font-size: clamp(28px, 5.4vw, 44px); }
  h1 em, h2 em { font-style: normal; color: var(--rose); }
  .lead { font-size: clamp(16px, 2.6vw, 18px); line-height: 1.8; color: var(--ink-soft); text-wrap: balance; }
  .text { display: grid; gap: 18px; justify-items: start; }

  /* arch photos */
  .arches { position: relative; height: clamp(340px, 52vh, 500px); }
  .arch {
    position: absolute; overflow: hidden; background: var(--white);
    border-radius: 999px 999px 24px 24px;
    border: 6px solid var(--white); box-shadow: var(--shadow);
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 999px 999px 18px 18px; }
  .arch.a1 { width: 58%; height: 92%; left: 4%; top: 0; }
  .arch.a2 { width: 44%; height: 64%; right: 2%; bottom: 0; animation: bob 6s ease-in-out infinite; }
  .dot {
    position: absolute; width: 74px; height: 74px; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--white); box-shadow: var(--shadow);
    right: 30%; top: 4%; animation: bob 5s ease-in-out infinite reverse;
  }
  .dot img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes bob { 50% { transform: translateY(-10px); } }

  /* buttons */
  .btn {
    border: 1.5px solid var(--pink-deep); border-radius: 999px; cursor: pointer;
    padding: 15px 30px; font-size: 17px; font-weight: 500; letter-spacing: .02em;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px dashed var(--pink-deep); outline-offset: 4px; }
  .btn.solid {
    background: linear-gradient(135deg, #f3a2b8, var(--pink-deep)); color: #fff; border-color: transparent;
    box-shadow: 0 14px 28px -14px rgba(199, 91, 122, .9);
  }
  .btn.ghost { background: rgba(255,255,255,.75); color: var(--rose); }
  .answers { display: flex; flex-wrap: wrap; gap: 12px; }

  /* ribbon of photos */
  .ribbon {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1;
    overflow: hidden; padding: 14px 0 max(14px, env(safe-area-inset-bottom));
    -webkit-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    opacity: .9; transition: opacity .6s ease;
  }
  .ribbon .track { display: flex; gap: 14px; width: max-content; animation: slide 40s linear infinite; }
  .ribbon img {
    width: 78px; height: 78px; object-fit: cover; border-radius: 18px;
    border: 3px solid var(--white); box-shadow: 0 10px 20px -12px rgba(199, 91, 122, .6);
  }
  @keyframes slide { to { transform: translateX(-50%); } }
  body.asking .ribbon, body.done .ribbon { opacity: 0; }

  /* question screen */
  .q { text-align: center; justify-items: center; }
  .q .text { justify-items: center; }
  .q .label::after { content: ""; width: 28px; height: 1px; background: var(--pink-deep); }
  .q .answers { justify-content: center; }
  .frame {
    width: clamp(200px, 40vw, 260px); aspect-ratio: 4 / 5; margin: 0 auto;
    border-radius: 999px 999px 28px 28px; overflow: hidden;
    border: 6px solid var(--white); box-shadow: var(--shadow);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }

  /* alt toast */
  .peek {
    margin-top: 6px; min-height: 28px; font-size: 16px; color: var(--rose);
    opacity: 0; transform: translateY(6px); transition: opacity .4s ease, transform .4s ease;
  }
  .peek.show { opacity: 1; transform: none; }

  /* done screen */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .grid img {
    width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block;
    border-radius: 18px; border: 4px solid var(--white); box-shadow: var(--shadow);
  }
  .grid img:nth-child(2) { transform: translateY(-16px); }
  .grid img:nth-child(5) { transform: translateY(-16px); }
  .date {
    display: inline-flex; flex-direction: column; gap: 2px;
    padding: 14px 22px; border-radius: 18px; background: rgba(255,255,255,.8);
    box-shadow: 0 12px 24px -16px rgba(199, 91, 122, .6);
  }
  .date small { font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); }
  .date b { font-weight: 500; font-size: 20px; color: var(--rose); }
  .link { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  /* hearts */
  #hearts { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .h {
    position: absolute; bottom: -40px; color: var(--pink-deep);
    animation: up linear forwards;
  }
  @keyframes up { to { transform: translate(var(--x), -115vh) rotate(var(--r)); opacity: 0; } }

  /* music */
  .music {
    position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    border: 0; cursor: pointer; border-radius: 999px;
    background: rgba(255,255,255,.85); padding: 8px 14px;
    box-shadow: 0 10px 20px -12px rgba(199, 91, 122, .6);
    color: var(--rose); font-size: 13px;
  }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .bars i { width: 3px; height: 3px; background: var(--pink-deep); border-radius: 2px; }
  .music.playing .bars i { animation: eq .9s ease-in-out infinite; }
  .music.playing .bars i:nth-child(2) { animation-delay: .2s; }
  .music.playing .bars i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 50% { height: 12px; } }

  @media (max-width: 819px) {
    .screen { place-items: start center; padding-top: 70px; padding-bottom: 120px; }
    .intro .text { justify-items: center; text-align: center; }
    .intro .label::after { content: ""; width: 28px; height: 1px; background: var(--pink-deep); }
    .arches { height: 330px; max-width: 380px; width: 100%; margin: 0 auto; }
    .inner { gap: 28px; }
    .done .text { justify-items: center; text-align: center; }
    .done .label::after { content: ""; width: 28px; height: 1px; background: var(--pink-deep); }
    .answers { flex-direction: column; width: 100%; max-width: 320px; }
    .ribbon img { width: 62px; height: 62px; border-radius: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="hearts" aria-hidden="true"></div>

  <button class="music" id="musicBtn" aria-label="เปิด/ปิดเพลง">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="musicText">เปิดเพลง</span>
  </button>
  <audio id="song" src="assets/audio/song.mp3" loop preload="auto"></audio>

  <!-- 1. intro -->
  <section class="screen intro active" id="s1">
    <div class="inner split">
      <div class="arches">
        <div class="arch a1"><img src="assets/img/flowers.jpg" alt="ช่อดอกไม้"></div>
        <div class="arch a2"><img src="assets/img/fah-3.jpg" alt="ฟ้าชูสองนิ้ว"></div>
        <div class="dot"><img src="assets/img/fah-1.jpg" alt="ฟ้าในชุดนักเรียน"></div>
      </div>
      <div class="text">
        <span class="label">for you</span>
        <h1>เค้ามีคำถาม<br><em>หนึ่งข้อ</em></h1>
        <p class="lead">ข้อเดียวจริง ๆ ค่ะ<br>ตั้งใจตอบนะ ♡</p>
        <button class="btn solid" id="start">ดูคำถาม</button>
      </div>
    </div>
  </section>

  <!-- 2. question -->
  <section class="screen" id="s2" aria-hidden="true">
    <div class="inner q">
      <div class="frame"><img src="assets/img/us.jpg" alt="ภาพวาดเราสองคน"></div>
      <div class="text">
        <span class="label">question</span>
        <h2>เป็นแฟนกับเค้า<br><em>ได้ไหมคะ?</em></h2>
        <div class="answers">
          <button class="btn solid" data-answer="yes">เป็น</button>
          <button class="btn ghost" data-answer="alt">เป็นแต่อีกข้อนึง</button>
        </div>
        <p class="peek" id="peek" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <!-- 3. done -->
  <section class="screen done" id="s3" aria-hidden="true">
    <div class="inner split">
      <div class="text">
        <span class="label">yes!</span>
        <h2>ตั้งแต่วันนี้<br><em>เราเป็นแฟนกันแล้วนะ</em></h2>
        <p class="lead">เค้าจะดูแลเธอให้ดีที่สุดเลย<br>รักเธอนะคะ ที่รักของเค้า ♡</p>
        <div class="date"><small>วันแรกของเรา</small><b>16 ตุลาคม 2026</b></div>
        <button class="link" id="again">ตอบใหม่อีกรอบ</button>
      </div>
      <div class="grid">
        <img src="assets/img/fah-1.jpg" alt="ฟ้าในชุดนักเรียน">
        <img src="assets/img/us.jpg" alt="ภาพวาดเราสองคน">
        <img src="assets/img/fah-3.jpg" alt="ฟ้าชูสองนิ้ว">
        <img src="assets/img/fah-2.jpg" alt="ฟ้าเสื้อสีฟ้า">
        <img src="assets/img/flowers.jpg" alt="ช่อดอกไม้">
        <img src="assets/img/fah-4.jpg" alt="ฟ้ากับตุ๊กตา">
      </div>
    </div>
  </section>

  <div class="ribbon" aria-hidden="true">
    <div class="track">
      <img src="assets/img/fah-1.jpg" alt=""><img src="assets/img/flowers.jpg" alt=""><img src="assets/img/fah-2.jpg" alt=""><img src="assets/img/us.jpg" alt=""><img src="assets/img/fah-3.jpg" alt=""><img src="assets/img/note.jpg" alt=""><img src="assets/img/fah-4.jpg" alt="">
      <img src="assets/img/fah-1.jpg" alt=""><img src="assets/img/flowers.jpg" alt=""><img src="assets/img/fah-2.jpg" alt=""><img src="assets/img/us.jpg" alt=""><img src="assets/img/fah-3.jpg" alt=""><img src="assets/img/note.jpg" alt=""><img src="assets/img/fah-4.jpg" alt="">
    </div>
  </div>

<script>
(function () {
  var song = document.getElementById('song');
  var musicBtn = document.getElementById('musicBtn');
  var musicText = document.getElementById('musicText');
  var peek = document.getElementById('peek');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer;

  function setPlaying(on) {
    musicBtn.classList.toggle('playing', on);
    musicText.textContent = on ? 'กำลังเล่น' : 'เปิดเพลง';
  }
  function play() {
    var p = song.play();
    if (p && p.then) p.then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
    else setPlaying(true);
  }
  musicBtn.addEventListener('click', function () {
    if (song.paused) play(); else { song.pause(); setPlaying(false); }
  });

  function go(id) {
    document.querySelectorAll('.screen').forEach(function (s) {
      var on = s.id === id;
      s.classList.toggle('active', on);
      s.setAttribute('aria-hidden', on ? 'false' : 'true');
      if (on) s.scrollTop = 0;
    });
    document.body.classList.toggle('asking', id === 's2');
    document.body.classList.toggle('done', id === 's3');
  }

  document.getElementById('start').addEventListener('click', function () {
    if (song.paused) play();
    go('s2');
  });

  document.querySelectorAll('[data-answer]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      clearTimeout(timer);
      if (btn.dataset.answer === 'alt') {
        peek.textContent = 'อีกข้อนึงก็คือ… เป็น อยู่ดีนั่นแหละ 😝';
        peek.classList.add('show');
        hearts(12);
        timer = setTimeout(function () { go('s3'); hearts(40); }, reduce ? 800 : 2200);
      } else {
        go('s3'); hearts(40);
      }
    });
  });

  document.getElementById('again').addEventListener('click', function () {
    peek.classList.remove('show'); peek.textContent = '';
    go('s2');
  });

  var layer = document.getElementById('hearts');
  function hearts(n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) (function (i) {
      setTimeout(function () {
        var h = document.createElement('span');
        h.className = 'h';
        h.textContent = Math.random() < .5 ? '♥' : '♡';
        var dur = 3.5 + Math.random() * 3;
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = 14 + Math.random() * 22 + 'px';
        h.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
        h.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
        h.style.animationDuration = dur + 's';
        layer.appendChild(h);
        setTimeout(function () { h.remove(); }, dur * 1000 + 100);
      }, i * 70);
    })(i);
  }
})();
</script>
</body>
</html>
